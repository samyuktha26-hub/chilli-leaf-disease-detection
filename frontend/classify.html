<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chilli Disease Detector</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-brand">Chilli Disease Detector</div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="classify.html" class="active">Classify & Retrain</a></li>
    </ul>
  </nav>

  <!-- Classification -->
  <section class="classify-section">
    <h3>Upload & Classify</h3>
    <form id="uploadForm">
      <input type="file" id="fileInput" accept="image/*" />
      <button type="submit">Classify</button>
    </form>

    <div class="preview-container">
      <img id="preview" alt="Preview" style="max-width: 300px; display:none;">
    </div>

    <div id="invalidMsg" style="color:red; font-size:18px; margin-top:10px; display:none;"></div>

    <div class="heatmap-container" style="margin-top:12px;">
      <h4>Explainability (Heatmap)</h4>
      <img id="heatmap" style="max-width:300px; display:none;">
    </div>

    <div id="loader" class="loader" style="display:none;"></div>

    <div id="resultCard" class="result-card" style="display:none;">
      <p><strong>Prediction:</strong> <span id="predLabel"></span></p>
      <p><strong>Confidence:</strong> <span id="predConfidence"></span>%</p>
      <p><strong>Severity:</strong> <span id="predSeverity"></span></p>
      <h4>Treatment</h4>
      <table id="treatmentTable">
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- Chatbot -->
  <section class="chatbot-section">
    <button id="chatToggleBtn" style="position:fixed; bottom:20px; right:20px; padding:10px 15px; border-radius:50px; background:#4caf50; color:white;">
      Chatbot
    </button>

    <div id="chatContainer" style="display:none; position:fixed; bottom:70px; right:20px; width:350px; max-height:400px; background:#222; border-radius:10px; overflow:hidden; flex-direction:column;">
      <div id="chatBox" style="flex:1; padding:10px; overflow-y:auto; color:#fff;"></div>
      <div style="display:flex; padding:5px;">
        <input type="text" id="chatInput" placeholder="Ask something..." style="flex:1; padding:5px; border-radius:5px;">
        <button id="chatBtn" style="margin-left:5px; padding:5px 10px; background:#4caf50; color:white;">Send</button>
      </div>
    </div>
  </section>

  <section class="retrain-section">
    <h3>Retrain the Model</h3>
    <button id="retrainBtn">Retrain Model</button>
    <div id="retrainStatus"></div>
  </section>

  <!-- Sound Alert -->
  <audio id="alertSound" src="invalid.mp3"></audio>

  <script src="script.js"></script>
</body>
</html>
